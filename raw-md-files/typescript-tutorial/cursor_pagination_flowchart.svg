<svg id="diagram-graph" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 100%; max-height: 100%; width: auto; height: auto; background-color: transparent;" viewBox="-12 -12 525 930" role="graphics-document document" aria-roledescription="flowchart-v2" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    #diagram-graph {
      font-family: "Recursive Variable", arial, sans-serif;
      font-size: 14px;
      fill: #cccccc;
    }
    #diagram-graph svg {
      font-family: "Recursive Variable", arial, sans-serif;
      font-size: 14px;
    }
