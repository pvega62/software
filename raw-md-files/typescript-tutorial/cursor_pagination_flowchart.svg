      stroke: #cccccc;
      stroke-width: 2px;
    }
    #diagram-graph .flowchart-link {
      stroke: #cccccc;
      fill: none;
    }
    #diagram-graph .edgeLabel {
      text-align: center;
    }
    #diagram-graph .labelBkg {
      background-color: hsl(180, 1.5873015873%, 28.3529411765%);
      border-radius: 4px;
      padding: 4px 10px;
      display: inline-block;
      white-space: nowrap;
      color: #e0dfdf;
      font-size: 12px;
      line-height: 1.2;
    }
    #diagram-graph foreignObject,
    #diagram-graph .node foreignObject,
    #diagram-graph .edgeLabel foreignObject {
      overflow: visible !important;
    }
    #diagram-graph .node foreignObject div {
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      text-align: center !important;
      box-sizing: border-box !important;
      line-height: 1.4 !important;
    }
    #diagram-graph .edgeLabel foreignObject div {
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      text-align: center !important;
      box-sizing: border-box !important;
    }
    #diagram-graph .edgeLabel span.edgeLabel {
      font-family: "Recursive Variable", arial, sans-serif;
      font-size: 12px;
      color: #e0dfdf;
    }
    #diagram-graph .node .nodeLabel {
      font-family: "Recursive Variable", arial, sans-serif;
      font-size: 14px;
      color: #e0dfdf;
    }
