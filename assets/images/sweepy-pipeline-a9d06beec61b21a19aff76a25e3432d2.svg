<svg id="diagram-graph" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 100%; max-height: 100%; width: auto; height: auto; background-color: transparent;" viewBox="2.5 0.0 677.0 608.0" role="graphics-document document" aria-roledescription="flowchart-v2" aria-label="Five-stage Sweepy sweep pipeline: load profile, discover roles, validate links, score matches, generate reports" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    #diagram-graph {
      font-family: "Recursive Variable", arial, sans-serif;
      font-size: 14px;
      fill: #cccccc;
    }
    #diagram-graph svg {
      font-family: "Recursive Variable", arial, sans-serif;
      font-size: 14px;
    }
    #diagram-graph p {
      margin: 0;
    }
    #diagram-graph .label {
      font-family: "Recursive Variable", arial, sans-serif;
      color: #e0dfdf;
    }
    #diagram-graph .label text,
    #diagram-graph span,
    #diagram-graph .nodeLabel {
      fill: #e0dfdf;
      color: #e0dfdf;
    }
    #diagram-graph .node rect,
    #diagram-graph .node circle,
    #diagram-graph .node ellipse,
    #diagram-graph .node polygon,
    #diagram-graph .node path {
      fill: #111113;
      stroke: #FFFFFF;
      stroke-width: 2px;
    }
    #diagram-graph [data-look="neo"].node rect,
    #diagram-graph [data-look="neo"].node polygon,
    #diagram-graph [data-look="neo"].node .outer-path {
      stroke: #FFFFFF;
      stroke-width: 2px;
      filter: url(#diagram-graph-drop-shadow);
    }
    #diagram-graph .marker {
      fill: #cccccc;
      stroke: #cccccc;
    }
    #diagram-graph .arrowheadPath {
      fill: #cccccc;
    }
    #diagram-graph .edgePath .path {
      stroke: #cccccc;
      stroke-width: 2px;
    }
    #diagram-graph .flowchart-link {
      stroke: #cccccc;
      fill: none;
      stroke-width: 1.5px;
    }
    #diagram-graph .edgeLabel {
      text-align: center;
    }
    #diagram-graph .labelBkg {
      background-color: hsl(180, 1.5873015873%, 28.3529411765%);
      border-radius: 4px;
      padding: 4px 10px;
      display: inline-block;
      white-space: nowrap;
      color: #e0dfdf;
      font-size: 12px;
      line-height: 1.2;
    }
    #diagram-graph foreignObject,
    #diagram-graph .node foreignObject,
    #diagram-graph .edgeLabel foreignObject {
      overflow: visible !important;
    }
    #diagram-graph .node foreignObject div {
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      text-align: center !important;
      box-sizing: border-box !important;
      line-height: 1.4 !important;
    }
    #diagram-graph .edgeLabel foreignObject div {
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      text-align: center !important;
      box-sizing: border-box !important;
    }
    #diagram-graph .edgeLabel span.edgeLabel {
      font-family: "Recursive Variable", arial, sans-serif;
      font-size: 12px;
      color: #e0dfdf;
    }
    #diagram-graph .node .nodeLabel {
      font-family: "Recursive Variable", arial, sans-serif;
      font-size: 14px;
      color: #e0dfdf;
    }
  </style>
